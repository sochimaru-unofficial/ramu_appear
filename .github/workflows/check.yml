name: YouTube Comment Checker

on:
  schedule:
    - cron: '0/5 * * * *' # 5分おきに自動実行
  workflow_dispatch: # 手動で動かすためのボタンも設置

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 1. 前回の実行時に保存した「全体の最後のコメント時刻」を復元
    - name: Restore last check time
      uses: actions/cache@v5
      with:
        path: last_comment_time.txt
        key: last-comment-time-${{ github.run_id }}
        restore-keys: |
          last-comment-time-

    # ✨ 追加ポイント：前回の実行時に保存した「ターゲットの最新コメント情報」を復元
    - name: Restore target last comment
      uses: actions/cache@v5
      with:
        path: target_last_comment.txt
        key: target-last-comment-${{ github.run_id }}
        restore-keys: |
          target-last-comment-

    # 4つの金庫の鍵をプログラムに渡す
    - name: Run script
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        VIDEO_URL: ${{ secrets.VIDEO_URL }}
        TARGET_USER: ${{ secrets.TARGET_USER }}
      run: python check_comment.py

    # 2. 今回の最新チェック時刻を次回のために保存
    - name: Save last check time
      uses: actions/cache@v5
      with:
        path: last_comment_time.txt
        key: last-comment-time-${{ github.run_id }}

    # ✨ 追加ポイント：今回のターゲットの最新コメント情報を次回のために保存
    - name: Save target last comment
      uses: actions/cache@v5
      with:
        path: target_last_comment.txt
        key: target-last-comment-${{ github.run_id }}
