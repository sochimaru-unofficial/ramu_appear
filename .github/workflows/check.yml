name: YouTube Comment Checker

on:
  schedule:
    - cron: '*/6 * * * *' # 6分おきに自動実行
  workflow_dispatch: # 手動実行ボタン

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install requests

    # スクリプトを実行
    - name: Run script
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        VIDEO_URL: ${{ secrets.VIDEO_URL }}
        TARGET_USER: ${{ secrets.TARGET_USER }}
      run: python check_comment.py

    # 更新されたJSONファイルがあれば自動でコミット＆プッシュして次回に引き継ぐ
    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add comment_data.json
        git diff --cached --quiet || (git commit -m "Update comment data [skip ci]" && git push)
