name: YouTube Comment Checker

on:
  schedule:
    - cron: '*/5 * * * *' # 5分おきに実行
  workflow_dispatch: # 手動で動かすためのボタンも設置

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5 # 💡 v4 から v5 に変更

    - name: Set up Python
      uses: actions/setup-python@v6 # 💡 v5 から v6 に変更
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 前回の実行時に保存した「最後のコメント時刻」を復元する
    - name: Restore last check time
      uses: actions/cache@v5 # 💡 v4 から v5 に変更
      with:
        path: last_comment_time.txt
        key: last-comment-time-${{ github.run_id }}
        restore-keys: |
          last-comment-time-

    - name: Run script
      run: python check_comment.py

    # 今回の最新チェック時刻を次回のために保存（キャッシュ）する
    - name: Save last check time
      uses: actions/cache@v5 # 💡 v4 から v5 に変更
      with:
        path: last_comment_time.txt
        key: last-comment-time-${{ github.run_id }}
